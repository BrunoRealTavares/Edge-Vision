<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EdgeSecurity - Painel Principal</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bibliotecas externas -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!--
    CSS das páginas carregados ANTES do sidebar.css.
    O sidebar.css é o ÚLTIMO e usa !important para ganhar todos os conflitos
    de layout (body, .sidebar, .main-content, .topbar).
  -->
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/Inicio.css" />
  <link rel="stylesheet" href="../css/funcoes.css" />
  <link rel="stylesheet" href="../css/controle.css" />
  <link rel="stylesheet" href="../css/adicionar.css" />
  <link rel="stylesheet" href="../css/relatorios.css" />

  <!-- sidebar.css SEMPRE POR ÚLTIMO — sobrescreve conflitos -->
  <link rel="stylesheet" href="../css/sidebar.css" />
</head>
<body>

  <div class="app-layout">

    <!-- ── SIDEBAR ─────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-texture"></div>
      <div class="sidebar-inner">

        <div class="sidebar-brand">EdgeSecurity</div>

        <nav class="sidebar-nav">
          <button class="nav-item active" data-id="Inicio">
            <i data-lucide="home"></i>
            Início
          </button>
          <button class="nav-item" data-id="funcoes">
            <i data-lucide="settings-2"></i>
            Funções principais
          </button>
          <button class="nav-item" data-id="controle">
            <i data-lucide="users"></i>
            Controle de acesso
          </button>
          <button class="nav-item" data-id="adicionar">
            <i data-lucide="file-plus"></i>
            Adicionar despachos
          </button>
          <button class="nav-item" data-id="relatorios">
            <i data-lucide="bar-chart-2"></i>
            Relatórios
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="status-alert mb-3">
            <div class="d-flex align-items-center gap-2 fw-semibold small mb-1"
                 style="color:#f87171;">
              <i class="bi bi-exclamation-triangle-fill" style="color:#eab308;"></i>
              Status
            </div>
            <small class="d-block text-white" style="font-size:11px;">Câmera 3 offline</small>
          </div>

          <div class="sidebar-divider"></div>

          <button class="logout-btn" id="btnSair">
            <i data-lucide="log-out"></i>
            Sair
          </button>
        </div>

      </div>
    </aside>

    <!-- ── CONTEÚDO DINÂMICO ────────────────────────────── -->
    <main class="main-content" id="dynamic-content"></main>

  </div>

  <!-- VLibras acessibilidade -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Bootstrap JS (necessário para componentes Bootstrap) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica principal -->
  <script src="../js/sidebar.js"></script>
</body>
</html>
