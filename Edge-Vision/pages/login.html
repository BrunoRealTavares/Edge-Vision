<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeSecurity - Página de Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Edge-Vision/css/login.css">
</head>
<body>

    <div class="page-container">
        
        <div class="left-panel">
            <div class="logo-wrapper">
                <h1 class="brand-name">EdgeSecurity</h1>
            </div>
        </div>

        <div class="right-panel">
            <div class="login-card">
                <p class="card-instruction">Informe suas credenciais para acessar a aplicação</p>
                
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="username" placeholder="Login" required autocomplete="username">
                    </div>

                    <div class="input-group">
                        <i class="fa-regular fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
                        <i class="fa-regular fa-eye toggle-password" id="togglePasswordIcon"></i>
                    </div>

                    <button type="submit" class="btn-submit">Entrar</button>
                </form>

                <a href="#" class="problems-link">Problemas?</a>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
