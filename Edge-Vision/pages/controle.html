<div class="main-inner" style="width: 100%; box-sizing: border-box;">
    <main style="margin: 0; width: 100%;">
        <section class="stats-grid">
            <div class="card">
                <div>
                    <p>Total de Acessos</p>
                    <h2 id="total-count">6</h2>
                </div>
                <div class="icon-circle blue"><i class="fas fa-clock"></i></div>
            </div>
            <div class="card">
                <div>
                    <p>Acessos Permitidos</p>
                    <h2 id="allowed-count" class="text-green">5</h2>
                </div>
                <div class="icon-circle green"><i class="fas fa-user-check"></i></div>
            </div>
            <div class="card">
                <div>
                    <p>Acessos Negados</p>
                    <h2 id="denied-count" class="text-red">1</h2>
                </div>
                <div class="icon-circle red"><i class="fas fa-user-times"></i></div>
            </div>
        </section>

        <section class="table-container">
            <div class="table-header">
                <h3>Registro de Controle de Acesso</h3>
                <span>Histórico de entradas e saídas</span>
            </div>
            
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nome ou crachá...">
            </div>

            <div style="overflow-x: auto; width: 100%;">
                <table id="accessTable" style="min-width: 600px; width: 100%;">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Crachá</th>
                            <th>Horário</th>
                            <th>Data</th>
                            <th>Local</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="/Edge-Vision/Edge-Vision/js/sidebar.js"></script>
