<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Acesso</title>

    <link rel="stylesheet" href="/Edge-Vision/css/controle.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<script>
(function(d){
    var s = d.createElement("script");
    s.setAttribute("data-account", "YOUR_ACCOUNT_ID");
    s.src = "https://cdn.userway.org/widget.js";
    (d.body || d.head).appendChild(s);
})(document);
</script>
<body>

    <div class="container">

        <main class="content">

            <header class="topbar">

                <div>
                    <h1>Olá!</h1>
                    <p>Bem-vindo ao painel de monitoramento</p>
                </div>

                <div class="profile">

                    <div class="profile-info">
                        <span>Meu perfil</span>
                        <small>Administrador</small>
                    </div>

                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>

                </div>

            </header>

            <section class="cards">

                <div class="card">
                    <div>
                        <p>Total de Acessos</p>
                        <h2 id="total-count">0</h2>
                    </div>

                    <div class="icon blue">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>

                <div class="card">
                    <div>
                        <p>Acessos Permitidos</p>
                        <h2 class="green" id="allowed-count">0</h2>
                    </div>

                    <div class="icon green-bg">
                        <i class="fas fa-user-check"></i>
                    </div>
                </div>

                <div class="card">
                    <div>
                        <p>Acessos Negados</p>
                        <h2 class="red" id="denied-count">0</h2>
                    </div>

                    <div class="icon red-bg">
                        <i class="fas fa-user-times"></i>
                    </div>
                </div>

            </section>

            <section class="table-container">

                <div class="table-header">
                    <h3>Registro de Controle de Acesso</h3>
                    <span>Histórico de entradas e saídas</span>
                </div>

                <div class="search-box">

                    <i class="fas fa-search"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Buscar por nome ou crachá..."
                    >

                </div>

                <table>

                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Crachá</th>
                            <th>Horário</th>
                            <th>Data</th>
                            <th>Local</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody">
                    </tbody>

                </table>

            </section>

        </main>

    </div>


    <script src="/Edge-Vision/js/controle.js"></script>

    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
<script>

</script>
</body>
</html>
